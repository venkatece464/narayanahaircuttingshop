<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="barber-chair-svg" aria-hidden="true">
  <defs>
    <!-- Warm Gold Gradients -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Dark Salon Obsidian / Leather Gradients -->
    <linearGradient id="darkLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="45%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="cushionHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="30%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Chrome / Steel Gradient -->
    <linearGradient id="chromeSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="chairGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Glow Ring under Chair -->
  <ellipse cx="50" cy="92" rx="28" ry="6" fill="#F59E0B" opacity="0.2" />

  <!-- Heavy Circular Hydraulic Base with Gold Rim -->
  <ellipse cx="50" cy="91" rx="24" ry="5.5" fill="url(#darkLeather)" stroke="url(#goldMetallic)" stroke-width="2" />
  <ellipse cx="50" cy="89" rx="18" ry="3.8" fill="url(#goldMetallic)" opacity="0.85" />
  <ellipse cx="50" cy="88" rx="12" ry="2.6" fill="url(#darkLeather)" />

  <!-- Hydraulic Stem & Pump Cylinder -->
  <rect x="46.5" y="72" width="7" height="17" rx="2" fill="url(#goldBright)" />
  <rect x="47.5" y="72" width="2" height="17" fill="#FFF" opacity="0.6" />
  <!-- Hydraulic Foot Pump Pedal -->
  <path d="M47 84 L33 87 L33 89 L47 86 Z" fill="url(#goldMetallic)" />
  <circle cx="33" cy="88" r="2.5" fill="url(#goldBright)" />

  <!-- Footrest Assembly -->
  <path d="M44 71 L32 78 L26 78 L26 80 L34 80 L46 73 Z" fill="url(#goldMetallic)" />
  <!-- Footrest Pad with Grip Treads -->
  <polygon points="20,78 32,78 34,81 18,81" fill="url(#darkLeather)" stroke="url(#goldMetallic)" stroke-width="1" />
  <line x1="22" y1="79.5" x2="30" y2="79.5" stroke="url(#goldMetallic)" stroke-width="1" />

  <!-- Seat Base Mounting Bracket -->
  <path d="M42 69 L58 69 L56 73 L44 73 Z" fill="url(#goldMetallic)" />

  <!-- Deep Cushioned Salon Seat -->
  <rect x="30" y="58" width="40" height="12" rx="5" fill="url(#cushionHighlight)" stroke="url(#goldMetallic)" stroke-width="1.8" filter="url(#chairGlow)" />
  <!-- Seat Cushion Center Stitch Accent -->
  <path d="M33 64 Q50 67 67 64" fill="none" stroke="url(#goldMetallic)" stroke-width="1.2" opacity="0.8" />
  <ellipse cx="50" cy="64.5" rx="1.5" ry="1" fill="#FDE68A" />

  <!-- Ergonomic Backrest -->
  <rect x="33" y="27" width="34" height="32" rx="6" fill="url(#darkLeather)" stroke="url(#goldMetallic)" stroke-width="1.8" />
  <!-- Tufted / Ribbed Backrest Inset & Gold Stitching -->
  <rect x="36.5" y="30" width="27" height="26" rx="4" fill="url(#cushionHighlight)" />
  <line x1="37" y1="36" x2="63" y2="36" stroke="url(#goldMetallic)" stroke-width="1" opacity="0.75" />
  <line x1="37" y1="43" x2="63" y2="43" stroke="url(#goldMetallic)" stroke-width="1" opacity="0.75" />
  <line x1="37" y1="50" x2="63" y2="50" stroke="url(#goldMetallic)" stroke-width="1" opacity="0.75" />
  <!-- Diamond / Center Button Accents -->
  <circle cx="50" cy="36" r="1.3" fill="#FDE68A" />
  <circle cx="50" cy="43" r="1.3" fill="#FDE68A" />
  <circle cx="50" cy="50" r="1.3" fill="#FDE68A" />

  <!-- Reclining Lever with Gold Ball -->
  <line x1="67" y1="59" x2="75" y2="52" stroke="url(#goldMetallic)" stroke-width="2" stroke-linecap="round" />
  <circle cx="75" cy="52" r="3" fill="url(#goldBright)" />

  <!-- Headrest Chrome Support Rods -->
  <line x1="45" y1="27" x2="45" y2="18" stroke="url(#chromeSteel)" stroke-width="2" />
  <line x1="55" y1="27" x2="55" y2="18" stroke="url(#chromeSteel)" stroke-width="2" />

  <!-- Padded Headrest Cushion -->
  <rect x="39" y="11" width="22" height="9" rx="3.5" fill="url(#darkLeather)" stroke="url(#goldMetallic)" stroke-width="1.5" />
  <line x1="42" y1="15.5" x2="58" y2="15.5" stroke="url(#goldMetallic)" stroke-width="1" opacity="0.8" />

  <!-- Left Armrest (Gold Strut + Leather Pad) -->
  <path d="M30 62 L23 62 L23 45 L32 45" fill="none" stroke="url(#goldMetallic)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="20" y="42" width="13" height="5" rx="2" fill="url(#cushionHighlight)" stroke="url(#goldMetallic)" stroke-width="1" />

  <!-- Right Armrest (Gold Strut + Leather Pad) -->
  <path d="M70 62 L77 62 L77 45 L68 45" fill="none" stroke="url(#goldMetallic)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="67" y="42" width="13" height="5" rx="2" fill="url(#cushionHighlight)" stroke="url(#goldMetallic)" stroke-width="1" />
</svg>
